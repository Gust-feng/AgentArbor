name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Check release commit whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff-tree --check --root --no-commit-id -r "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows desktop
        run: pnpm dist:desktop:win

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-windows-release.mjs
