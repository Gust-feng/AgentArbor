<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具解释输出预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --preview-page-width: 1380px;
      --preview-reading-width: 880px;
      --preview-probe-width: 392px;
      --step-read: var(--state-info);
      --step-search: color-mix(in srgb, var(--state-info) 72%, var(--color-primary));
      --step-edit: var(--state-warning);
      --step-command: color-mix(in srgb, var(--color-fg-secondary) 68%, var(--state-info));
      --step-web: color-mix(in srgb, var(--color-primary) 58%, var(--state-info));
      --step-other: var(--color-fg-secondary);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 28px;
      background:
        radial-gradient(circle at top, color-mix(in srgb, var(--color-surface-raised) 18%, transparent) 0%, transparent 38%),
        linear-gradient(180deg, color-mix(in srgb, var(--color-bg) 96%, var(--color-surface)) 0%, var(--color-bg) 100%);
    }

    button {
      font: inherit;
    }

    code,
    pre {
      font-family: var(--font-mono);
    }

    a {
      color: inherit;
    }

    .preview-shell {
      display: grid;
      gap: 36px;
      max-width: var(--preview-page-width);
      margin: 0 auto;
    }

    .preview-topbar {
      display: grid;
      gap: 14px;
      padding: 0 0 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border) 84%, transparent);
    }

    .preview-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px 24px;
      flex-wrap: wrap;
    }

    .preview-title-block {
      min-width: 0;
    }

    .preview-title {
      margin: 0;
      font-size: 24px;
      font-weight: var(--weight-semibold);
      line-height: var(--leading-tight);
      color: var(--color-fg);
    }

    .preview-controls {
      display: flex;
      align-items: flex-start;
      gap: 10px 16px;
      flex-wrap: wrap;
    }

    .control-group {
      display: grid;
      gap: 6px;
    }

    .control-group > span {
      font-size: 11px;
      font-weight: var(--weight-semibold);
      color: var(--color-fg-tertiary);
      letter-spacing: 0;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 4px;
      border: 1px solid color-mix(in srgb, var(--color-border) 88%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-surface) 96%, transparent);
    }

    .segmented button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--color-fg-tertiary);
      cursor: pointer;
      transition:
        background-color var(--duration-normal) var(--ease-spring),
        color var(--duration-normal) var(--ease-spring),
        border-color var(--duration-normal) var(--ease-spring);
    }

    .segmented button[aria-pressed="true"] {
      background: var(--color-surface);
      color: var(--color-fg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-border) 88%, transparent);
    }

    .segmented button:hover {
      color: var(--color-fg);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      gap: 40px;
      align-items: start;
    }

    .surface-card {
      display: grid;
      gap: 18px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: none;
    }

    .surface-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border) 84%, transparent);
    }

    .surface-title-block {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .surface-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 0;
      border-radius: 0;
      border: 0;
      background: none;
      color: var(--color-fg-tertiary);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      line-height: 1;
    }

    .surface-title {
      margin: 0;
      font-size: 16px;
      font-weight: var(--weight-semibold);
      line-height: var(--leading-tight);
      color: var(--color-fg);
    }

    .surface-subtitle {
      display: none;
    }

    .metric-row {
      display: none;
    }

    .timeline-shell {
      width: min(100%, var(--preview-reading-width));
      min-width: 0;
    }

    .timeline-steps {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .tool-step {
      position: relative;
      --tool-attention-color: transparent;
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--color-border) 82%, transparent);
      border-radius: 16px;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--color-surface) 98%, transparent) 0%,
        color-mix(in srgb, var(--color-surface-raised) 14%, var(--color-surface)) 100%
      );
      box-shadow:
        0 1px 0 color-mix(in srgb, white 52%, transparent) inset,
        0 10px 24px color-mix(in srgb, var(--color-fg) 3%, transparent);
      overflow: hidden;
      transition:
        border-color var(--duration-normal) var(--ease-spring),
        background-color var(--duration-normal) var(--ease-spring),
        box-shadow var(--duration-normal) var(--ease-spring);
    }

    .tool-step::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: color-mix(in srgb, white 56%, transparent);
      pointer-events: none;
    }

    .tool-step[open] {
      box-shadow:
        0 1px 0 color-mix(in srgb, white 58%, transparent) inset,
        0 16px 34px color-mix(in srgb, var(--color-fg) 5%, transparent);
    }

    .tool-step:hover {
      border-color: color-mix(in srgb, var(--color-fg) 10%, var(--color-border));
    }

    .tool-step[data-phase="failed"],
    .tool-step[data-phase="blocked"] {
      --tool-attention-color: color-mix(in srgb, var(--state-error) 82%, transparent);
      border-color: color-mix(in srgb, var(--state-error) 16%, var(--color-border));
    }

    .tool-step[data-phase="waiting_approval"] {
      --tool-attention-color: color-mix(in srgb, var(--state-warning) 88%, transparent);
      border-color: color-mix(in srgb, var(--state-warning) 18%, var(--color-border));
    }

    .tool-step[data-phase="executing"] {
      --tool-attention-color: color-mix(in srgb, var(--state-info) 84%, transparent);
      border-color: color-mix(in srgb, var(--state-info) 16%, var(--color-border));
    }

    .tool-step > summary {
      list-style: none;
      display: block;
      padding: 18px 20px;
      cursor: pointer;
    }

    .tool-step > summary::-webkit-details-marker {
      display: none;
    }

    .tool-step-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
      position: relative;
    }

    .tool-step-main {
      display: grid;
      gap: 0;
      min-width: 0;
      flex: 1 1 auto;
    }

    .tool-attention-edge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 8px;
      min-height: 24px;
      align-self: flex-start;
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .tool-attention-edge::before {
      content: "";
      width: 3px;
      height: 18px;
      border-radius: 999px;
      background: var(--tool-attention-color);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--tool-attention-color) 24%, transparent);
    }

    .tool-icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: color-mix(in srgb, var(--color-surface-raised) 54%, var(--color-surface));
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--color-border-subtle) 84%, transparent),
        0 6px 14px color-mix(in srgb, var(--color-fg) 3%, transparent);
      flex: 0 0 auto;
    }

    .tool-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      color: var(--color-fg-secondary);
      flex: 0 0 auto;
    }

    .tool-disclosure {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-top: 5px;
      color: color-mix(in srgb, var(--color-fg-tertiary) 78%, transparent);
      flex: 0 0 auto;
    }

    .tool-disclosure i {
      transition:
        transform var(--duration-normal) var(--ease-spring),
        color var(--duration-normal) var(--ease-spring);
    }

    .tool-step[open] .tool-disclosure i {
      transform: rotate(90deg);
      color: var(--color-fg-secondary);
    }

    .tool-step-body {
      display: grid;
      gap: 12px;
      min-width: 0;
      padding: 4px 20px 20px;
      border-top: 1px solid color-mix(in srgb, var(--color-border-subtle) 74%, transparent);
    }

    .tool-detail-header {
      display: grid;
      gap: 6px;
      min-width: 0;
      padding-top: 10px;
    }

    .tool-detail-target {
      min-width: 0;
      color: var(--color-fg-tertiary);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      font-family: var(--font-mono);
    }

    .fact-row {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      flex-wrap: wrap;
    }

    .fact-chip {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      max-width: 100%;
      color: var(--color-fg-tertiary);
      font-size: 11px;
      font-weight: var(--weight-medium);
      line-height: 1.4;
      white-space: normal;
    }

    .fact-chip + .fact-chip {
      margin-left: 8px;
      padding-left: 12px;
    }

    .fact-chip + .fact-chip::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-fg-tertiary) 72%, transparent);
      transform: translateY(-50%);
    }

    .fact-chip[data-monospace="true"] .fact-value {
      font-family: var(--font-mono);
    }

    .fact-label {
      color: var(--color-fg-tertiary);
    }

    .fact-value {
      color: var(--color-fg-secondary);
      font-weight: var(--weight-semibold);
    }

    .fact-chip[data-tone="success"] .fact-value {
      color: var(--state-success);
    }

    .fact-chip[data-tone="warning"] .fact-value {
      color: var(--state-warning);
    }

    .fact-chip[data-tone="danger"] .fact-value {
      color: var(--state-error);
    }

    .tool-output-lead {
      min-width: 0;
      padding: 0;
      border: 0;
      background: none;
    }

    .tool-output-lead p {
      margin: 0;
      min-width: 0;
      color: var(--color-fg);
      max-width: 68ch;
      font-size: 15.5px;
      font-weight: var(--weight-medium);
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    .tool-output-lead[data-tone="danger"] p {
      color: color-mix(in srgb, var(--state-error) 82%, var(--color-fg));
    }

    .tool-output-lead[data-tone="warning"] p {
      color: color-mix(in srgb, var(--state-warning) 88%, var(--color-fg));
    }

    .result-panel {
      display: grid;
      gap: 10px;
      min-width: 0;
      padding: 2px 0 0;
      border-left: 0;
    }

    .preview-frame {
      display: grid;
      gap: 0;
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--color-border) 84%, transparent);
      border-radius: 16px;
      background: color-mix(in srgb, var(--color-surface-raised) 18%, var(--color-surface));
      box-shadow:
        0 1px 0 color-mix(in srgb, white 48%, transparent) inset,
        0 12px 24px color-mix(in srgb, var(--color-fg) 3%, transparent);
      overflow: hidden;
    }

    .preview-frame[data-tone="danger"] {
      border-color: color-mix(in srgb, var(--state-error) 18%, var(--color-border));
      background: color-mix(in srgb, var(--state-error-soft) 18%, var(--color-surface));
    }

    .preview-frame[data-tone="warning"] {
      border-color: color-mix(in srgb, var(--state-warning) 20%, var(--color-border));
      background: color-mix(in srgb, var(--state-warning-soft) 18%, var(--color-surface));
    }

    .preview-frame-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px 15px;
      border-bottom: 1px solid color-mix(in srgb, var(--color-border-subtle) 86%, transparent);
      background: color-mix(in srgb, var(--color-surface-raised) 28%, var(--color-surface));
    }

    .preview-frame-header-main {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      flex: 1 1 240px;
    }

    .preview-frame-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--color-surface) 42%, var(--color-surface-raised));
      color: var(--color-fg-secondary);
      flex: 0 0 auto;
    }

    .preview-frame-header[data-kind="file"] .preview-frame-icon {
      color: color-mix(in srgb, var(--step-read) 74%, var(--color-fg));
      background: color-mix(in srgb, var(--step-read) 12%, var(--color-surface));
    }

    .preview-frame-header[data-kind="source"] .preview-frame-icon {
      color: color-mix(in srgb, var(--step-search) 74%, var(--color-fg));
      background: color-mix(in srgb, var(--step-search) 12%, var(--color-surface));
    }

    .preview-frame-header[data-kind="diff"] .preview-frame-icon {
      color: color-mix(in srgb, var(--step-edit) 78%, var(--color-fg));
      background: color-mix(in srgb, var(--step-edit) 14%, var(--color-surface));
    }

    .preview-frame-header[data-kind="console"] .preview-frame-icon {
      color: color-mix(in srgb, var(--step-command) 80%, var(--color-fg));
      background: color-mix(in srgb, var(--step-command) 12%, var(--color-surface));
    }

    .preview-frame-header[data-kind="approval"] .preview-frame-icon {
      color: color-mix(in srgb, var(--state-warning) 88%, var(--color-fg));
      background: color-mix(in srgb, var(--state-warning-soft) 28%, var(--color-surface));
    }

    .preview-frame-title {
      display: grid;
      gap: 3px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .preview-frame-title strong {
      font-size: 12.5px;
      font-weight: var(--weight-semibold);
      color: var(--color-fg);
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .preview-frame-title span,
    .preview-frame-meta {
      color: var(--color-fg-secondary);
      font-size: 11px;
      line-height: 1.4;
    }

    .preview-frame-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preview-frame-meta-item {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--color-surface) 32%, var(--color-surface-raised));
      color: var(--color-fg-secondary);
      font-size: 11px;
      font-weight: var(--weight-semibold);
    }

    .preview-text-note {
      padding: 0;
      border-radius: 0;
      background: none;
      color: var(--color-fg-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    .preview-text-note[data-tone="danger"] {
      background: none;
      color: color-mix(in srgb, var(--state-error) 88%, var(--color-fg));
    }

    .preview-text-note[data-tone="warning"] {
      background: none;
      color: color-mix(in srgb, var(--state-warning) 88%, var(--color-fg));
    }

    .preview-text-note p {
      margin: 0;
    }

    .preview-secondary {
      display: grid;
      gap: 0;
      min-width: 0;
      padding: 10px 14px 12px;
      border-top: 1px solid color-mix(in srgb, var(--color-border-subtle) 72%, transparent);
    }

    .preview-secondary details {
      min-width: 0;
    }

    .preview-secondary summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      color: var(--color-fg-tertiary);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      line-height: 1;
      cursor: pointer;
    }

    .preview-secondary summary::-webkit-details-marker {
      display: none;
    }

    .preview-secondary summary i {
      transition: transform var(--duration-normal) var(--ease-spring);
    }

    .preview-secondary details[open] summary i {
      transform: rotate(90deg);
    }

    .preview-secondary-body {
      display: grid;
      gap: 10px;
      min-width: 0;
      padding-top: 10px;
    }

    .preview-code-lines,
    .preview-console-lines,
    .preview-diff-lines {
      display: grid;
      min-width: 0;
    }

    .preview-code-line,
    .preview-console-line,
    .preview-diff-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
      padding: 9px 14px;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .preview-code-line:not(:last-child),
    .preview-console-line:not(:last-child),
    .preview-diff-line:not(:last-child) {
      border-bottom: 1px solid color-mix(in srgb, var(--color-border-subtle) 70%, transparent);
    }

    .preview-code-line-number,
    .preview-console-gutter,
    .preview-diff-marker {
      color: var(--color-fg-tertiary);
      user-select: none;
      min-width: 3ch;
      text-align: right;
    }

    .preview-code-line code,
    .preview-console-line code,
    .preview-diff-line code {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      color: var(--color-fg);
    }

    .preview-code-line[data-highlight="true"] {
      background: color-mix(in srgb, var(--state-info-soft) 34%, transparent);
      box-shadow: inset 2px 0 0 color-mix(in srgb, var(--step-read) 72%, transparent);
    }

    .preview-frame-code .preview-code-lines {
      background: color-mix(in srgb, var(--color-surface) 78%, var(--color-surface-raised));
    }

    .preview-frame-code .preview-code-line-number {
      color: color-mix(in srgb, var(--step-read) 52%, var(--color-fg-tertiary));
    }

    .preview-console-line[data-kind="prompt"] code {
      color: var(--color-fg);
    }

    .preview-console-line[data-kind="success"] code {
      color: var(--state-success);
    }

    .preview-console-line[data-kind="error"] code {
      color: var(--state-error);
    }

    .preview-frame-console {
      border-color: color-mix(in srgb, var(--step-command) 20%, var(--color-border));
      background: color-mix(in srgb, #0d1117 95%, var(--color-surface));
      box-shadow:
        0 1px 0 color-mix(in srgb, white 10%, transparent) inset,
        0 16px 28px color-mix(in srgb, black 10%, transparent);
    }

    .preview-terminal-shell {
      display: grid;
      gap: 0;
      min-width: 0;
      background: linear-gradient(
        180deg,
        color-mix(in srgb, #131923 96%, transparent) 0%,
        color-mix(in srgb, #0d1117 98%, transparent) 100%
      );
    }

    .preview-terminal-command {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 13px 15px;
      border-bottom: 1px solid color-mix(in srgb, white 8%, transparent);
      background: color-mix(in srgb, white 4%, transparent);
    }

    .preview-terminal-command-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .preview-terminal-prompt {
      color: #6dd6a4;
      user-select: none;
    }

    .preview-terminal-command code {
      min-width: 0;
      color: #f3f6fb;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .preview-terminal-inline-meta {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: color-mix(in srgb, white 8%, transparent);
      color: #dce5f2;
      font-size: 11px;
      font-weight: var(--weight-semibold);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .preview-terminal-banner {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
      padding: 10px 14px;
      border-bottom: 1px solid color-mix(in srgb, white 8%, transparent);
      font-size: 11px;
      line-height: 1.45;
    }

    .preview-terminal-banner-dot {
      width: 7px;
      height: 7px;
      margin-top: 4px;
      border-radius: 999px;
      background: color-mix(in srgb, #8ea0b8 72%, transparent);
      flex: 0 0 auto;
    }

    .preview-terminal-banner p {

    const iconNames = {

    const consolePatterns = {
      error: /error|unexpected|failed/i,

      success: /done|completed|passed|ok|0 problems|no issues|generated|created|saved|updated|wrote|checked\./i,

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function applyTheme() {
      document.documentElement.classList.remove("light", "dark");

    function updateControlState() {
      document.querySelectorAll("[data-control]").forEach((button) => {

      if (block?.tone) return block.tone;

    function frameMetaItems(meta) {
      if (Array.isArray(meta)) return meta.filter((item) => typeof item === "string" && item.length > 0);

    function renderFrameHeader(kind, title, subtitle, meta) {

    function renderSecondaryDisclosure(label, body, options) {
      const content = String(body ?? "").trim();
      if (content.length === 0) return "";
      const open = options?.open ? " open" : "";
      const variant = options?.variant ? ` data-variant="${escapeHtml(options.variant)}"` : "";
      return `
        <div class="preview-secondary"${variant}>

    }

    function renderCodeLines(content, lineStart, highlights) {
      const start = Number.isFinite(lineStart) ? lineStart : 1;
      const highlightSet = new Set(Array.isArray(highlights) ? highlights : []);
      return content.split("\n").map((line, index) => `
        <div class="preview-code-line" data-highlight="${highlightSet.has(start + index) ? "true" : "false"}">
          <span class="preview-code-line-number">${start + index}</span>
          <code>${escapeHtml(line.length === 0 ? " " : line)}</code>
        </div>
      `).join("");
    }

    function renderConsoleLines(content) {
      return content.split("\n").map((line) => {
        let kind = "muted";
        let gutter = "·";
        let text = line;
        if (line.startsWith("$ ")) {
          kind = "prompt";
          gutter = "$";
          text = line.slice(2);
        } else if (consolePatterns.progress.test(line)) {
          kind = "progress";
          gutter = ">";
        } else if (consolePatterns.success.test(line)) {
          kind = "success";
          gutter = "+";
        } else if (consolePatterns.error.test(line)) {
          kind = "error";
          gutter = "!";
        } else if (line.trim().length === 0) {
          gutter = " ";
          text = " ";
        }
        return `
          <div class="preview-console-line" data-kind="${kind}">
            <span class="preview-console-gutter">${escapeHtml(gutter)}</span>
            <code>${escapeHtml(text.length === 0 ? " " : text)}</code>
          </div>
        `;
      }).join("");
    }

    function splitConsoleTranscript(content) {
      const lines = String(content ?? "").split("\n");
      let commandLine = "";
      if (lines[0]?.startsWith("$ ")) {
        commandLine = lines.shift().slice(2);
      }
      return {
        commandLine,
        output: lines.join("\n"),
      };
    }

    function meaningfulConsoleLines(lines) {
      return lines.filter((line) => !consolePatterns.boilerplate.test(line));
    }

    function recentDistinct(lines, count) {
      const picked = [];
      const seen = new Set();
      for (let index = lines.length - 1; index >= 0 && picked.length < count; index -= 1) {
        const line = lines[index];
        if (!line || seen.has(line)) continue;
        seen.add(line);
        picked.push(line);
      }
      return picked.reverse();
    }

    function classifyConsoleLine(line) {
      const text = String(line ?? "");
      if (consolePatterns.error.test(text)) {
        return { kind: "error", mark: "!" };
      }
      if (consolePatterns.progress.test(text)) {
        return { kind: "progress", mark: ">" };
      }
      if (consolePatterns.success.test(text)) {
        return { kind: "success", mark: "+" };
      }
      return { kind: "muted", mark: "·" };
    }

    function consoleSummaryLines(step, transcript) {
      const lines = String(transcript.output ?? "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);
      if (lines.length === 0) return [];
      const reduced = meaningfulConsoleLines(lines);
      const candidates = reduced.length > 0 ? reduced : lines;

      if (step.execution.phase === "failed" || step.execution.phase === "blocked") {
        const errors = candidates.filter((line) => consolePatterns.error.test(line));
        if (errors.length > 0) return recentDistinct(errors, 2);
        return recentDistinct(candidates, 2);
      }

      if (step.execution.phase === "executing") {
        return recentDistinct(candidates, 3);
      }

      const successLines = candidates.filter((line) => consolePatterns.success.test(line));
      if (successLines.length > 0) return recentDistinct(successLines, 2);
      return recentDistinct(candidates, 2);
    }

    function renderConsoleSummary(step, transcript) {
      const lines = consoleSummaryLines(step, transcript);
      if (lines.length === 0) return "";
      return `
        <div class="preview-terminal-summary">
          ${lines.map((line) => {
            const info = classifyConsoleLine(line);
            return `
              <div class="preview-terminal-summary-row" data-kind="${info.kind}">
                <span class="preview-terminal-summary-mark">${escapeHtml(info.mark)}</span>
                <code>${escapeHtml(line)}</code>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function consoleBannerTone(step) {
      if (step.execution.phase === "executing") return "accent";
      if (step.execution.phase === "failed" || step.execution.phase === "blocked") return "danger";
      return "neutral";
    }

    function consoleBannerText(step, transcript) {
      const lines = String(transcript.output ?? "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);
      if (lines.length === 0) return "";
      const reduced = meaningfulConsoleLines(lines);
      const candidates = reduced.length > 0 ? reduced : lines;
      if (step.execution.phase === "failed" || step.execution.phase === "blocked") {
        return candidates.find((line) => consolePatterns.error.test(line)) ?? candidates[candidates.length - 1];
      }
      return candidates[candidates.length - 1];
    }

    function renderConsoleBanner(step, transcript) {
      if (step.execution.phase !== "executing" && step.execution.phase !== "failed" && step.execution.phase !== "blocked") {
        return "";
      }
      const text = consoleBannerText(step, transcript);
      if (!text) return "";
      return `
        <div class="preview-terminal-banner" data-tone="${escapeHtml(consoleBannerTone(step))}">
          <span class="preview-terminal-banner-dot"></span>
          <p>${escapeHtml(text || " ")}</p>
        </div>
      `;
    }

    function renderConsoleRaw(step, transcript) {
      const output = String(transcript.output ?? "");
      if (output.trim().length === 0) return "";
      const lineCount = output.split("\n").filter((line) => line.trim().length > 0).length;
      return renderSecondaryDisclosure(
        lineCount > 0 ? `原始输出 ${lineCount} 行` : "原始输出",
        `<div class="preview-console-lines">${renderConsoleLines(output)}</div>`,
        { variant: "console" },
      );
    }

    function splitDiffForDisplay(content, maxHunks) {
      const lines = String(content ?? "").split("\n");
      const files = [];
      const limit = Math.max(1, Number.isFinite(maxHunks) ? maxHunks : 1);
      let currentFile = { headers: [], hunks: [] };
      let currentHunk = null;

      function pushCurrentFile() {
        if (currentFile.headers.length > 0 || currentFile.hunks.length > 0) {
          files.push(currentFile);
        }
      }

      lines.forEach((line) => {
        if (line.startsWith("diff --git")) {
          pushCurrentFile();
          currentFile = { headers: [line], hunks: [] };
          currentHunk = null;
          return;
        }

        if (
          line.startsWith("index ")
          || line.startsWith("new file mode")
          || line.startsWith("deleted file mode")
          || line.startsWith("--- ")
          || line.startsWith("+++ ")
        ) {
          currentFile.headers.push(line);
          currentHunk = null;
          return;
        }

        if (line.startsWith("@@")) {
          currentHunk = [line];
          currentFile.hunks.push(currentHunk);
          return;
        }

        if (!currentHunk) {
          return;
        }

        currentHunk.push(line);
      });

      pushCurrentFile();

      const totalHunks = files.reduce((count, file) => count + file.hunks.length, 0);
      if (totalHunks === 0) {
        return {
          focus: content,
          hasOverflow: false,
        };
      }

      const focusFile = files.find((file) => file.hunks.length > 0) ?? files[0];
      const focusHunks = focusFile.hunks.slice(0, limit);

      return {
        focus: [...focusFile.headers, ...focusHunks.flat()].join("\n"),
        hasOverflow: totalHunks > focusHunks.length,
      };
    }

    function diffStats(content) {
      let added = 0;
      let removed = 0;
      let hunks = 0;
      let files = 0;
      content.split("\n").forEach((line) => {
        if (line.startsWith("@@")) {
          hunks += 1;
          return;
        }
        if (line.startsWith("+++ ")) {
          files += 1;
          return;
        }
        if (line.startsWith("--- ")) {
          return;
        }
        if (line.startsWith("+")) {
          added += 1;
          return;
        }
        if (line.startsWith("-")) {
          removed += 1;
        }
      });
      return { added, removed, hunks, files };
    }

    function diffLines(content) {
      return content.split("\n").map((line) => {
        let kind = "context";
        let marker = "";
        let text = line;
        if (line.startsWith("@@")) {
          kind = "hunk";
          marker = "@";
        } else if (line.startsWith("+++ ") || line.startsWith("--- ")) {
          kind = "file";
        } else if (line.startsWith("+")) {
          kind = "add";
          marker = "+";
          text = line.slice(1);
        } else if (line.startsWith("-")) {
          kind = "delete";
          marker = "-";
          text = line.slice(1);
        }
        return `
          <div class="preview-diff-line" data-kind="${kind}">
            <span class="preview-diff-marker">${escapeHtml(marker)}</span>
            <code>${escapeHtml(text.length === 0 ? " " : text)}</code>
          </div>
        `;
      }).join("");
    }

    function leadTextBlock(result) {
      return (result?.content ?? []).find((block) => block.type === "text" || block.type === "quote");
    }

    function detailTextBlocks(result) {
      const lead = leadTextBlock(result);
      let leadConsumed = false;
      return (result?.content ?? []).filter((block) => {
        if (block.type !== "text" && block.type !== "quote") return false;
        if (!leadConsumed && lead === block) {
          leadConsumed = true;
          return false;
        }
        return true;
      });
    }

    function firstCodeBlock(result, presentation) {
      return (result?.content ?? []).find((block) => block.type === "code" && block.presentation === presentation);
    }

    function approvalRiskLabel(level) {
      if (level === "low") return "低风险";
      if (level === "medium") return "中风险";
      if (level === "high") return "高风险";
      return level ? `${level}` : "";
    }

    function renderSourceCards(results) {
      return (results ?? []).map((source) => `
        <div class="preview-source-card">

          </div>
          ${source.url ? `<a class="preview-source-link" href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer noopener" aria-label="${escapeHtml(source.url)}" title="${escapeHtml(source.url)}"><i data-lucide="arrow-up-right" style="width: 12px; height: 12px;"></i></a>` : ""}
        </div>

    }

    function renderDetailTextBlocks(step) {
      return detailTextBlocks(step.result).map((block) => `

    function renderLeadOutput(step) {

    function renderReadResult(step, structured) {
      const codeBlock = firstCodeBlock(step.result, "file");
      if (!codeBlock) return renderDetailTextBlocks(step);

      return `

    function renderSearchResult(step, structured) {
      const results = structured.results ?? [];
      const count = structured.resultsReturned ?? results.length;
      const featured = results.slice(0, 3);
      const overflow = results.slice(3);
      return `
        ${renderDetailTextBlocks(step)}
        <div class="preview-frame preview-frame-source" data-tone="${escapeHtml(previewTone(step))}">

      `;
    }

    function renderDiffResult(step, structured) {
      const codeBlock = firstCodeBlock(step.result, "diff");
      if (!codeBlock) return renderDetailTextBlocks(step);
      const stats = diffStats(codeBlock.text);
      const display = splitDiffForDisplay(codeBlock.text, 1);
      const added = structured.added ?? stats.added;
      const removed = structured.removed ?? stats.removed;
      const meta = [];
      if (added > 0) meta.push(`+${added}`);
      if (removed > 0) meta.push(`-${removed}`);
      if (stats.hunks > 0) meta.push(`${stats.hunks} 处`);
      return `
        ${renderDetailTextBlocks(step)}
        <div class="preview-frame preview-frame-diff" data-tone="${escapeHtml(previewTone(step, codeBlock))}">
          ${renderFrameHeader("diff", structured.path ?? codeBlock.title ?? step.tool.target, "", meta)}
          <div class="preview-diff-lines">${diffLines(display.focus)}</div>
          ${display.hasOverflow ? renderSecondaryDisclosure(
            "完整补丁",
            `<div class="preview-diff-lines">${diffLines(codeBlock.text)}</div>`,
          ) : ""}
        </div>
      `;
    }

    function renderCommandResult(step, structured) {
      const codeBlock = firstCodeBlock(step.result, "console");
      const transcript = splitConsoleTranscript(codeBlock?.text ?? "");
      const commandLine = transcript.commandLine || structured.commandLine || step.tool.target;
      const meta = [];
      if (step.execution.phase === "executing" && typeof structured.durationMs === "number") {
        meta.push(`${(structured.durationMs / 1000).toFixed(1)}s`);
      }
      if ((step.execution.phase === "failed" || step.execution.phase === "blocked") && typeof structured.exitCode === "number" && structured.exitCode !== 0) {
        meta.push(`exit ${structured.exitCode}`);
      }
      return `
        ${renderDetailTextBlocks(step)}
        ${codeBlock ? `
          <div class="preview-frame preview-frame-console" data-tone="${escapeHtml(previewTone(step, codeBlock))}">
            <div class="preview-terminal-shell">
              <div class="preview-terminal-command">
                <div class="preview-terminal-command-main">
                  <span class="preview-terminal-prompt">$</span>
                  <code>${escapeHtml(commandLine)}</code>
                </div>
                ${meta.length > 0 ? `<div class="preview-terminal-inline-meta">${meta.map((item) => escapeHtml(item)).join(" · ")}</div>` : ""}
              </div>
              ${renderConsoleBanner(step, transcript)}
              ${renderConsoleSummary(step, transcript)}
              <div class="preview-terminal-scroll">
                ${renderConsoleRaw(step, transcript)}
                ${step.execution.phase === "executing" ? `
                  <div class="preview-console-cursor-line">
                    <span>></span>
                    <code><span class="preview-terminal-caret"></span></code>
                  </div>
                ` : ""}
              </div>
            </div>
          </div>
        ` : ""}
      `;
    }

    function renderApprovalResult(step, structured) {
      const riskLabel = approvalRiskLabel(structured.riskLevel);
      const affected = structured.affectedResources?.length ?? 0;
      const meta = [];
      if (riskLabel) meta.push(riskLabel);
      if (affected > 0) meta.push(`${affected} 个对象`);
      return `
        ${renderDetailTextBlocks(step)}
        <div class="preview-frame preview-frame-approval approval-frame" data-tone="${escapeHtml(previewTone(step))}">
          ${renderFrameHeader("approval", structured.actionSummary ?? step.tool.target, "", meta)}
          <div class="approval-body">
            <ul class="approval-list">
              ${(structured.affectedResources ?? []).map((resource) => `<li><span>${escapeHtml(resource)}</span></li>`).join("")}
            </ul>
          </div>
        </div>

    }

    function renderGenericResult(step) {
      return renderDetailTextBlocks(step);
    }

    function renderResultBody(step) {
      const structured = step.result?.structuredContent;
      if (!structured) return renderGenericResult(step);
      if (structured.kind === "read_result") return renderReadResult(step, structured);
      if (structured.kind === "search_results") return renderSearchResult(step, structured);
      if (structured.kind === "file_diff_preview") return renderDiffResult(step, structured);
      if (structured.kind === "command_summary") return renderCommandResult(step, structured);
      if (structured.kind === "approval_request") return renderApprovalResult(step, structured);
      return renderGenericResult(step);
    }

    function renderResult(step) {
      if (!step.result) return "";
      const body = renderResultBody(step).trim();
      if (body.length === 0) return "";
      return `<div class="result-panel">${body}</div>`;
    }

    function renderDetailHeader(step) {
      const structuredKind = step.result?.structuredContent?.kind;
      if (structuredKind === "read_result"
        || structuredKind === "search_results"
        || structuredKind === "file_diff_preview"
        || structuredKind === "command_summary"
        || structuredKind === "approval_request") {
        return "";
      }
      const facts = (step.primaryFacts ?? []).slice(0, 2);
      if (!step.tool.target && facts.length === 0) return "";
      return `
        <div class="tool-detail-header">
          ${step.tool.target ? `<div class="tool-detail-target">${escapeHtml(step.tool.target)}</div>` : ""}
          ${facts.length > 0 ? `<div class="fact-row">${facts.map(renderFactChip).join("")}</div>` : ""}
        </div>
      `;
    }

    function renderStep(step) {
      const open = state.density === "expanded" ? " open" : "";
      const attention = hasAttentionState(step);
      return `
        <details class="tool-step" data-kind="${escapeHtml(step.tool.kind)}" data-phase="${escapeHtml(step.execution.phase)}"${open}>
          <summary>
            <div class="tool-step-card">
              <span class="tool-icon-badge">
                <span class="tool-icon">
                  <i data-lucide="${iconNames[step.tool.kind] ?? "sparkles"}" style="width: 14px; height: 14px;"></i>
                </span>
              </span>
              <div class="tool-step-main">
                ${renderLeadOutput(step)}
              </div>
              ${attention ? `<span class="tool-attention-edge" aria-hidden="true"></span>` : ""}
              <span class="tool-disclosure" aria-hidden="true">
                <i data-lucide="chevron-right" style="width: 14px; height: 14px;"></i>
              </span>
            </div>
          </summary>
          <div class="tool-step-body">
            ${renderDetailHeader(step)}
            ${renderResult(step)}
          </div>
        </details>
      `;
    }

    function renderTimeline(timeline) {
      return `
        <div class="timeline-shell">
          <div class="timeline-steps">
            ${timeline.steps.map((step) => renderStep(step)).join("")}
          </div>
        </div>
      `;
    }

    function render() {
      applyTheme();
      updateControlState();

      document.getElementById("main-timeline-host").innerHTML = renderTimeline(ordinaryConversation);
      document.getElementById("probe-timeline-host").innerHTML = renderTimeline(ordinaryConversation);
      document.getElementById("probe-mode").textContent = densityLabels[state.density];

      window.lucide.createIcons();
    }

    document.querySelectorAll("[data-control]").forEach((button) => {
      button.addEventListener("click", () => {
        state[button.dataset.control] = button.dataset.value;
        render();
      });
    });

    render();
  </script>
</body>
</html>
