<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23151821' stroke='%23b7a7ff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23b7a7ff'/%3E%3C/svg%3E" />
    <title>AgentArbor · 静夜工作台 Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11141b;
        --bg-deep: #0b0e14;
        --sidebar: #151821;
        --surface: #20242f;
        --surface-raised: #272b37;
        --surface-hover: #2c3040;
        --line: rgba(232, 229, 244, 0.1);
        --line-strong: rgba(232, 229, 244, 0.17);
        --text: #f2efe8;
        --text-soft: #b0afba;
        --text-muted: #777987;
        --accent: #b7a7ff;
        --accent-strong: #d0c5ff;
        --accent-wash: rgba(183, 167, 255, 0.13);
        --warm: #d7aa72;
        --green: #72c29a;
        --danger: #e28a8a;
        --font-ui: "Noto Sans SC", "PingFang SC", Inter, system-ui, sans-serif;
        --font-display: "Noto Serif SC", "Songti SC", Georgia, serif;
        --sidebar-width: 246px;
        --topbar-height: 54px;
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 22px;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg-deep);
        color: var(--text);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      button, textarea { font: inherit; }

      button {
        border: 0;
        color: inherit;
        cursor: pointer;
      }

      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        height: 100%;
        background: var(--bg);
      }

      .sidebar {
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 24%),
          var(--sidebar);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 23px 20px 26px;
      }

      .brand-mark {
        position: relative;
        width: 31px;
        height: 31px;
        border: 1px solid rgba(183, 167, 255, 0.72);
        border-radius: 50%;
        box-shadow: 0 0 0 5px rgba(183, 167, 255, 0.055);
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        display: block;
        content: "";
        border-radius: 50%;
      }

      .brand-mark::before {
        top: 8px;
        left: 8px;
        width: 13px;
        height: 13px;
        background: var(--accent);
        box-shadow: 0 0 16px rgba(183, 167, 255, 0.65);
      }

      .brand-mark::after {
        top: 13px;
        left: 13px;
        width: 3px;
        height: 3px;
        background: #fff;
      }

      .brand-copy { display: grid; gap: 2px; }
      .brand-title { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
      .brand-subtitle { color: var(--text-muted); font-size: 11px; letter-spacing: 0.06em; }

      .nav-scroll { flex: 1; overflow: auto; padding: 0 12px; scrollbar-width: none; }
      .nav-scroll::-webkit-scrollbar { display: none; }

      .nav-group { display: grid; gap: 3px; margin-bottom: 23px; }

      .nav-label {
        padding: 0 10px 8px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .nav-item {
        position: relative;
        display: flex;
        width: 100%;
        min-height: 36px;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-soft);
        text-align: left;
        transition: background-color 160ms ease, color 160ms ease;
      }

      .nav-item:hover { background: rgba(255, 255, 255, 0.045); color: var(--text); }

      .nav-item.active {
        background: var(--accent-wash);
        color: var(--accent-strong);
      }

      .nav-item.active::before {
        position: absolute;
        left: 0;
        width: 2px;
        height: 18px;
        border-radius: 99px;
        background: var(--accent);
        content: "";
      }

      .nav-item svg { flex: 0 0 auto; color: var(--text-muted); stroke-width: 1.7; }
      .nav-item.active svg { color: var(--accent); }
      .nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .nav-item .chevron { margin-left: auto; color: var(--text-muted); }

      .space-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .space-dot.green { color: var(--green); }
      .space-dot.amber { color: var(--warm); }
      .space-dot.violet { color: var(--accent); }

      .sidebar-footer {
        display: grid;
        gap: 13px;
        padding: 16px 14px 18px;
        border-top: 1px solid var(--line);
      }

      .quiet-status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        color: var(--text-muted);
        font-size: 11px;
      }

      .quiet-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(114, 194, 154, 0.08); }

      .settings-button {
        display: flex;
        height: 36px;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.025);
        color: var(--text-soft);
        text-align: left;
      }

      .settings-button:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.05); color: var(--text); }
      .settings-button span { font-size: 13px; }

      .main-shell { display: flex; min-width: 0; flex-direction: column; }

      .topbar {
        display: flex;
        height: var(--topbar-height);
        flex: 0 0 var(--topbar-height);
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(20, 23, 31, 0.82);
      }

      .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }

      .icon-button {
        display: inline-flex;
        width: 30px;
        height: 30px;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
      }

      .icon-button:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
      .breadcrumb { color: var(--text-muted); font-size: 12px; }
      .breadcrumb strong { color: var(--text-soft); font-weight: 500; }

      .theme-pill {
        display: inline-flex;
        height: 28px;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.025);
        color: var(--text-muted);
        font-size: 11px;
      }

      .theme-pill svg { color: var(--accent); }

      .canvas {
        position: relative;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        background: var(--bg);
      }

      .scene,
      .scene-grid,
      .scene-window,
      .scene-ring,
      .scene-floor,
      .lamp-glow { position: absolute; pointer-events: none; }

      .scene { inset: 0; overflow: hidden; background:
        radial-gradient(ellipse at 67% 46%, rgba(183, 167, 255, 0.1), transparent 37%),
        radial-gradient(ellipse at 72% 21%, rgba(215, 170, 114, 0.13), transparent 28%),
        linear-gradient(180deg, #1a1d29 0%, #151821 46%, #11141b 100%); }

      .scene::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(116deg, transparent 0 50%, rgba(255, 255, 255, 0.015) 50.2% 50.35%, transparent 50.55% 100%);
        content: "";
        opacity: 0.8;
      }

      .scene-grid {
        inset: 0;
        background-image:
          linear-gradient(rgba(183, 167, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(183, 167, 255, 0.04) 1px, transparent 1px);
        background-size: 78px 78px;
        mask-image: linear-gradient(180deg, black, transparent 73%);
        opacity: 0.34;
      }

      .scene-window {
        top: 11%;
        right: 11%;
        width: min(330px, 27vw);
        aspect-ratio: 1.1;
        border: 1px solid rgba(183, 167, 255, 0.13);
        border-radius: 48% 48% 8px 8px;
        box-shadow: inset 0 0 0 12px rgba(183, 167, 255, 0.018);
        transform: rotate(-8deg);
      }

      .scene-window::before,
      .scene-window::after { position: absolute; background: rgba(183, 167, 255, 0.1); content: ""; }
      .scene-window::before { top: 0; bottom: 0; left: 50%; width: 1px; }
      .scene-window::after { top: 50%; right: 0; left: 0; height: 1px; }

      .scene-ring { top: 8%; right: 4%; width: min(440px, 34vw); aspect-ratio: 1; border: 1px solid rgba(183, 167, 255, 0.07); border-radius: 50%; transform: rotate(24deg) scaleY(0.38); }
      .scene-ring::after { position: absolute; inset: 13%; border: 1px solid rgba(215, 170, 114, 0.07); border-radius: 50%; content: ""; }

      .scene-floor {
        right: -3%;
        bottom: -9%;
        left: -5%;
        height: 35%;
        background:
          linear-gradient(180deg, rgba(77, 83, 91, 0.1), transparent 50%),
          linear-gradient(172deg, transparent 0 18%, rgba(52, 65, 67, 0.38) 18.5% 45%, rgba(36, 45, 48, 0.6) 45.5% 72%, rgba(24, 30, 34, 0.82) 72.5% 100%);
        clip-path: polygon(0 22%, 17% 12%, 36% 17%, 52% 6%, 72% 14%, 100% 5%, 100% 100%, 0 100%);
      }

      .lamp-glow {
        top: 40%;
        left: 50%;
        width: min(780px, 74vw);
        height: min(270px, 28vh);
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(215, 170, 114, 0.12), transparent 68%);
        filter: blur(12px);
        transform: translate(-50%, -50%);
      }

      .home-content {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(780px, calc(100% - 64px));
        min-height: 100%;
        flex-direction: column;
        justify-content: center;
        margin: 0 auto;
        padding: 40px 0 72px;
      }

      .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 20px 18px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
      .eyebrow time { color: var(--text-muted); font-size: 10px; font-weight: 400; letter-spacing: 0.08em; }

      h1 { max-width: 650px; margin: 0 0 12px 18px; font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 42px); font-weight: 500; letter-spacing: 0.015em; line-height: 1.3; }
      .intro { max-width: 520px; margin: 0 0 30px 19px; color: var(--text-soft); font-size: 14px; line-height: 1.75; }

      .composer-wrap { position: relative; }

      .composer {
        position: relative;
        display: grid;
        gap: 0;
        overflow: hidden;
        border: 1px solid rgba(232, 229, 244, 0.18);
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(55, 58, 71, 0.78), rgba(35, 39, 50, 0.98));
        box-shadow: 0 28px 70px rgba(4, 6, 12, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .composer:focus-within { border-color: rgba(183, 167, 255, 0.56); box-shadow: 0 28px 70px rgba(4, 6, 12, 0.36), 0 0 0 3px rgba(183, 167, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.08); }

      .composer textarea { width: 100%; min-height: 134px; resize: none; padding: 20px 20px 12px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 16px; line-height: 1.65; }
      .composer textarea::placeholder { color: #898995; }

      .composer-bar { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 14px; padding: 0 12px 10px 14px; }
      .composer-left, .composer-right { display: flex; min-width: 0; align-items: center; gap: 8px; }

      .round-button { display: inline-flex; width: 31px; height: 31px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 50%; background: rgba(255, 255, 255, 0.035); color: var(--text-muted); }
      .round-button:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.08); color: var(--text); }

      .context-chip, .model-chip { display: inline-flex; height: 30px; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255, 255, 255, 0.035); color: var(--text-soft); font-size: 11px; white-space: nowrap; }
      .context-chip:hover, .model-chip:hover { border-color: var(--line-strong); color: var(--text); }
      .model-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 4px rgba(215, 170, 114, 0.1); }
      .model-chip svg { color: var(--text-muted); }

      .send-button { display: inline-flex; width: 35px; height: 35px; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: #191624; box-shadow: 0 8px 20px rgba(183, 167, 255, 0.18); transition: transform 160ms ease, background-color 160ms ease; }
      .send-button:hover:not(:disabled) { background: var(--accent-strong); transform: translateY(-1px); }
      .send-button:disabled { cursor: default; opacity: 0.34; box-shadow: none; }

      .context-row { display: flex; align-items: center; gap: 9px; margin: 12px 0 0 10px; color: var(--text-muted); font-size: 12px; }
      .context-row button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; background: transparent; color: var(--text-soft); }
      .context-row button:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
      .context-row .space-dot { width: 7px; height: 7px; }

      .home-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 28px 18px 0; color: var(--text-muted); font-size: 11px; }
      .home-meta span { display: inline-flex; align-items: center; gap: 7px; }
      .home-meta kbd { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text-soft); font-size: 10px; }

      .scene-signature { position: absolute; right: 26px; bottom: 22px; z-index: 1; color: rgba(183, 167, 255, 0.26); font-size: 10px; letter-spacing: 0.22em; writing-mode: vertical-rl; }

      .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; display: none; padding: 10px 13px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); color: var(--text-soft); font-size: 12px; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28); }
      .toast.show { display: block; }

      @media (max-width: 800px) {
        :root { --sidebar-width: 214px; }
        .home-content { width: min(700px, calc(100% - 40px)); }
        .scene-window { right: 5%; width: 250px; }
      }

      @media (max-width: 620px) {
        .app-shell { grid-template-columns: 64px minmax(0, 1fr); }
        .sidebar { align-items: center; }
        .brand { padding: 20px 0 26px; }
        .brand-copy, .nav-label, .nav-item span, .nav-item .chevron, .quiet-status, .settings-button span { display: none; }
        .nav-scroll { width: 100%; padding: 0 10px; }
        .nav-group { width: 100%; }
        .nav-item { justify-content: center; padding: 0; }
        .nav-item.active::before { left: -1px; }
        .sidebar-footer { width: 100%; padding: 14px 10px; }
        .settings-button { justify-content: center; padding: 0; }
        .topbar { padding: 0 14px; }
        .breadcrumb { display: none; }
        .home-content { width: calc(100% - 30px); padding-top: 24px; }
        .eyebrow, h1, .intro { margin-left: 4px; }
        h1 { font-size: 29px; }
        .composer textarea { min-height: 124px; }
        .context-chip { display: none; }
        .home-meta { margin-right: 4px; margin-left: 4px; }
        .scene-signature { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-copy">
            <span class="brand-title">AgentArbor</span>
            <span class="brand-subtitle">静夜工作台 · Demo</span>
          </span>
        </div>

        <div class="nav-scroll">
          <nav class="nav-group" aria-label="导航">
            <span class="nav-label">工作台</span>
            <button class="nav-item active" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></svg>
              <span>首页</span>
            </button>
            <button class="nav-item" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="m3 12 9 4 9-4"/><path d="m3 17 9 4 9-4"/></svg>
              <span>空间</span>
            </button>
            <button class="nav-item" type="button"><span class="space-dot green"></span><span>学习空间</span><svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            <button class="nav-item" type="button"><span class="space-dot amber"></span><span>项目空间</span><svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </nav>

          <nav class="nav-group" aria-label="工作区">
            <span class="nav-label">工作区</span>
            <button class="nav-item" type="button"><span class="space-dot violet"></span><span>从记事本开始</span><svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            <button class="nav-item" type="button"><span class="space-dot violet"></span><span>agent</span><svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            <button class="nav-item" type="button"><span class="space-dot violet"></span><span>AgentArbor_logo_assets</span><svg class="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </nav>

          <nav class="nav-group" aria-label="知识">
            <span class="nav-label">知识</span>
            <button class="nav-item" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21Z"/><path d="M4 5.5v15"/></svg>
              <span>知识库</span>
            </button>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="quiet-status"><i aria-hidden="true"></i><span>本地环境已准备好</span></div>
          <button class="settings-button" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 0 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1A2 2 0 0 0 1.7 12a2 2 0 0 1 0-4h.2a2 2 0 0 0 1.4-3.4l-.1-.1A2 2 0 0 1 6 1.7l.1.1A2 2 0 0 0 9.5.4h.2a2 2 0 0 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1A2 2 0 0 1 20 4.7l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 0 1 0 4h-.2a2 2 0 0 0-1.4 3.4Z" transform="translate(0 4) scale(.66)"/></svg>
            <span>设置</span>
          </button>
        </div>
      </aside>

      <section class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button" type="button" aria-label="收起侧栏">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16"/><path d="m13 10 2 2-2 2"/></svg>
            </button>
            <span class="breadcrumb"><strong>首页</strong><span> / 静夜工作台</span></span>
          </div>
          <div class="topbar-right">
            <span class="theme-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z"/></svg>深色 · 固定</span>
            <button class="icon-button" type="button" aria-label="搜索">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            </button>
          </div>
        </header>

        <main class="canvas" aria-label="静夜工作台首页">
          <div class="scene" aria-hidden="true">
            <span class="scene-grid"></span>
            <span class="scene-window"></span>
            <span class="scene-ring"></span>
            <span class="lamp-glow"></span>
            <span class="scene-floor"></span>
          </div>

          <section class="home-content">
            <div class="eyebrow">静夜工作台 <time>01:24 · 固定深色</time></div>
            <h1>今晚，先把一个念头安静地放下来。</h1>
            <p class="intro">不必急着完成。写下第一句，剩下的路交给思路慢慢展开。</p>

            <div class="composer-wrap">
              <form class="composer" id="composer-form">
                <textarea id="composer-input" aria-label="任务输入" placeholder="把今晚想做的事写下来…"></textarea>
                <div class="composer-bar">
                  <div class="composer-left">
                    <button class="round-button" type="button" aria-label="添加附件">+</button>
                    <button class="context-chip" type="button"><span class="space-dot green"></span>学习空间</button>
                  </div>
                  <div class="composer-right">
                    <button class="model-chip" type="button"><i aria-hidden="true"></i>MiniMax-M3<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
                    <button class="send-button" id="send-button" type="submit" aria-label="开始任务" disabled>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 3-1"/></svg>
                    </button>
                  </div>
                </div>
              </form>
            </div>

            <div class="context-row"><span class="space-dot green"></span><button type="button">学习空间 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
            <div class="home-meta"><span><span class="space-dot violet"></span>工作内容只在需要时展开</span><span><kbd>⌘</kbd><kbd>↵</kbd> 开始</span></div>
          </section>
          <span class="scene-signature">NOCTURNE / QUIET WORK</span>
        </main>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const input = document.getElementById('composer-input');
      const send = document.getElementById('send-button');
      const form = document.getElementById('composer-form');
      const toast = document.getElementById('toast');

      document.querySelectorAll('.nav-item').forEach((item) => {
        item.addEventListener('click', () => {
          document.querySelector('.nav-item.active')?.classList.remove('active');
          item.classList.add('active');
        });
      });

      input.addEventListener('input', () => {
        send.disabled = input.value.trim().length === 0;
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = input.value.trim();
        if (!value) return;
        toast.textContent = 'Demo 已接住这件事，正式运行将在工作台中继续。';
        toast.classList.add('show');
        input.value = '';
        send.disabled = true;
        window.setTimeout(() => toast.classList.remove('show'), 2600);
      });
    </script>
  </body>
