appId: com.agentarbor.desktop
productName: AgentArbor
directories:
  output: release
files:
  - package.json
  - from: dist
    to: dist
    filter:
      - "**/*"
      - "!**/*.test.js"
      - "!**/*.test.d.ts"
      - "!**/*.test.js.map"
      - "!**/*.test.ts"
      - "!**/*.map"
extraMetadata:
  main: dist/app/panel-desktop.js
  productName: AgentArbor
asar: true
compression: normal
publish:
  provider: github
  owner: Gust-feng
  repo: AgentArbor
  releaseType: release
win:
  icon: src/app/panel-ui/public/favicon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
nsis:
  installerIcon: src/app/panel-ui/public/favicon.ico
  uninstallerIcon: src/app/panel-ui/public/favicon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentArbor
