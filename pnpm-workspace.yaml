allowBuilds:
  electron: true
  electron-winstaller: false

# @openai/agents 0.13.3 is pinned and covered by the local protocol, approval,
# cancellation, session, and no-hosted-tracing contract probes. Keep the
# repository-wide release-age policy intact and exempt only this verified SDK set.
minimumReleaseAgeExclude:
  - "@openai/agents"
  - "@openai/agents-core"
  - "@openai/agents-openai"
  - "@openai/agents-realtime"
