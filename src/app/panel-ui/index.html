<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentArbor</title>
    <script>
      (() => {
        const styles = new Set(["default", "classic", "glass"]);
        const colorsByStyle = {
          default: new Set(["system", "light", "dark"]),
          classic: new Set(["warm", "forest", "slate"]),
          glass: new Set(["aurora", "sunset", "ocean"]),
        };
        const defaults = { default: "light", classic: "warm", glass: "aurora" };
        const motions = new Set(["system", "standard", "reduced"]);
        const systemColor = () =>
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const systemReducedMotion = () =>
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        try {
          const readPreference = (key) => window.agentarborDesktop?.getLocalPreference?.(key) ?? localStorage.getItem(key);
          const savedStyle = readPreference("agentarbor:style");
          const style = styles.has(savedStyle) ? savedStyle : "default";
          const savedColor = readPreference("agentarbor:color");
          const colorPreference = colorsByStyle[style].has(savedColor) ? savedColor : defaults[style];
          const color = style === "default" && colorPreference === "system" ? systemColor() : colorPreference;
          const savedMotion = readPreference("agentarbor:motion");
          const motion = motions.has(savedMotion) ? savedMotion : "system";
          const motionEffective = motion === "reduced" || (motion === "system" && systemReducedMotion())
            ? "reduced"
            : "standard";
          const startupAnimation = readPreference("agentarbor:startup-animation") === "true" ? "on" : "off";
          document.documentElement.dataset.style = style;
          document.documentElement.dataset.color = color;
          document.documentElement.dataset.colorPreference = colorPreference;
          document.documentElement.dataset.motion = motion;
          document.documentElement.dataset.motionEffective = motionEffective;
          document.documentElement.dataset.startupAnimation = startupAnimation;
        } catch {
          document.documentElement.dataset.style = "default";
          document.documentElement.dataset.color = "light";
          document.documentElement.dataset.colorPreference = "light";
          document.documentElement.dataset.motion = "system";
          document.documentElement.dataset.motionEffective = systemReducedMotion() ? "reduced" : "standard";
          document.documentElement.dataset.startupAnimation = "off";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- ordinary-screen-start -->
      <style>
        html,
        body,
        #root {
          height: 100%;
          margin: 0;
        }

        body {
          background: #f4f2ef;
          color: #292722;
          font-family: "Noto Sans SC", Inter, system-ui, -apple-system, sans-serif;
        }

        .redesign-bootstrap {
          display: flex;
          height: 100%;
          overflow: hidden;
          background: #f4f2ef;
        }

        .redesign-bootstrap__sidebar {
          width: 236px;
          flex: 0 0 236px;
          box-sizing: border-box;
          border-right: 1px solid rgba(45, 40, 34, 0.09);
          background: #faf9f7;
          padding: 138px 20px 16px;
        }

        .redesign-bootstrap__content {
          display: flex;
          min-width: 0;
          flex: 1;
          flex-direction: column;
        }

        .redesign-bootstrap__topbar {
          height: 44px;
          flex: 0 0 44px;
          border-bottom: 1px solid rgba(45, 40, 34, 0.09);
          background: #faf9f7;
        }

        .redesign-bootstrap__canvas {
          display: grid;
          min-height: 0;
          flex: 1;
          place-items: center;
        }

        .redesign-bootstrap__line {
          display: block;
          border-radius: 999px;
          background: #eeebe6;
        }

        .redesign-bootstrap__line {
          width: 118px;
          height: 10px;
          margin-bottom: 18px;
        }

        .redesign-bootstrap__line--short {
          width: 76px;
        }

      </style>
      <div class="redesign-bootstrap" aria-label="正在加载 AgentArbor">
        <aside class="redesign-bootstrap__sidebar" aria-hidden="true">
          <span class="redesign-bootstrap__line"></span>
          <span class="redesign-bootstrap__line redesign-bootstrap__line--short"></span>
        </aside>
        <main class="redesign-bootstrap__content">
          <div class="redesign-bootstrap__topbar" aria-hidden="true"></div>
          <div class="redesign-bootstrap__canvas"></div>
        </main>
      </div>
      <!-- ordinary-screen-end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
