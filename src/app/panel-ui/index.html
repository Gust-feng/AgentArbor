<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentArbor 工作台</title>
    <script>
      (() => {
        const styles = new Set(["default", "classic", "glass"]);
        const colorsByStyle = {
          default: new Set(["light", "dark"]),
          classic: new Set(["warm", "forest"]),
          glass: new Set(["aurora", "sunset", "ocean"]),
        };
        const defaults = { default: "light", classic: "warm", glass: "aurora" };
        try {
          const savedStyle = localStorage.getItem("agentarbor:style");
          const style = styles.has(savedStyle) ? savedStyle : "default";
          const savedColor = localStorage.getItem("agentarbor:color");
          const color = colorsByStyle[style].has(savedColor) ? savedColor : defaults[style];
          document.documentElement.dataset.style = style;
          document.documentElement.dataset.color = color;
        } catch {
          document.documentElement.dataset.style = "default";
          document.documentElement.dataset.color = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- ordinary-screen-start -->
      <style>
        html,
        body,
        #root {
          height: 100%;
          margin: 0;
        }

        body {
          background: #f4f6f5;
          color: #202225;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        }

        .panel-fallback {
          display: flex;
          height: 100%;
          overflow: hidden;
          background: #f4f6f5;
        }

        .panel-fallback aside {
          width: 280px;
          box-sizing: border-box;
          border-right: 2px solid #25272a;
          padding: 32px 20px;
        }

        .panel-fallback main {
          display: grid;
          flex: 1;
          place-items: center;
          padding: 40px;
        }

        .panel-fallback button {
          width: 100%;
          height: 42px;
          border: 2px solid #25272a;
          background: #25272a;
          color: #fff9f1;
          font: inherit;
          font-weight: 650;
          text-align: left;
          padding: 0 18px;
        }

        .panel-fallback h1 {
          margin: 0;
          border-bottom: 2px solid #25272a;
          padding-bottom: 12px;
          font-family: Georgia, "Times New Roman", Times, serif;
          font-size: 56px;
          line-height: 1;
        }
      </style>
      <div class="panel-fallback">
        <aside>
          <button type="button">新任务</button>
        </aside>
        <main aria-label="工作会话">
          <h1>新任务</h1>
        </main>
      </div>
      <!-- ordinary-screen-end -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
